name: README 优化订单
description: 为公开 GitHub 仓库申请 README 诊断、润色、翻译或 PR 交付
title: "[订单] "
labels:
  - order
body:
  - type: markdown
    attributes:
      value: |
        请只提交公开信息。不要填写密码、Token、私钥、手机号、交易单号或商业机密。
  - type: input
    id: repo
    attributes:
      label: 公开仓库链接
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: dropdown
    id: service
    attributes:
      label: 希望购买的服务
      options:
        - README 快速诊断（¥9.9）
        - 中文 README 润色（¥19.9）
        - 中英双语 README（¥39.9）
        - 完整文档 PR（¥69.9 起）
        - 暂不确定，请先报价
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标读者和希望改善的问题
      placeholder: 例如：让第一次访问的开发者在 5 分钟内完成安装并跑通示例。
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: 交付语言
      options:
        - 简体中文
        - 英文
        - 中英双语
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: 确认
      options:
        - label: 我确认仓库内容可公开处理，并且没有在 Issue 中提交敏感信息。
          required: true
        - label: 我理解最终价格会在样稿或诊断后确认，未确认前无需付款。
          required: true

